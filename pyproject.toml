[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty50-direction-prediction"
version = "0.1.0"
description = "Financial ML project for predicting next-day NIFTY 50 direction."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0,<3",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "tabulate>=0.9",
  "lightgbm>=4.6",
  "mlflow>=3.12",
  "reportlab>=4.5",
  "pypdf>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
